<article class="card h-100 shadow-sm border-0 recipe-card">
    {% if recipe.Dish_Image %}
        <img src="{{ recipe.Dish_Image.url }}" class="card-img-top public-recipe-image" alt="{{ recipe.Recepies_name }}">
    {% endif %}
    <div class="card-body d-flex flex-column">
        <span class="small text-muted">{{ recipe.category }}{% if recipe.Country %} · {{ recipe.Country }}{% endif %}</span>
        <h3 class="h5 mt-2">{{ recipe.Recepies_name }}</h3>
        <p class="card-text text-muted">{{ recipe.Recepies_description|truncatewords:20 }}</p>
        {% if recipe.total_likes is not None %}<p class="small text-muted">{{ recipe.total_likes }} likes</p>{% endif %}
        <a href="{% url 'recipe_detail' recipe.id %}" class="btn btn-primary mt-auto">View recipe</a>
    </div>
</article>
